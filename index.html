<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kid Sketch Converter</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      padding: 20px;
      background-color: #f4f4f9;
    }
    .controls {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .control-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      font-size: 14px;
    }
    .canvas-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    canvas {
      max-width: 400px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
    }
  </style>
</head>
<body>

  <h2>Kid Sketch Generator</h2>
  
  <div class="controls">
    <div class="control-group">
      <label>Upload Photo</label>
      <input type="file" id="upload" accept="image/*">
    </div>
    
    <div class="control-group">
      <label for="threshold">Sensitivity (Less = More Lines)</label>
      <input type="range" id="threshold" min="10" max="150" value="50">
    </div>

    <div class="control-group">
      <label for="blurAmount">Remove Details (Blur)</label>
      <input type="range" id="blurAmount" min="0" max="15" value="6">
    </div>

    <div class="control-group">
      <label for="thickness">Line Thickness</label>
      <input type="range" id="thickness" min="1" max="8" value="3">
    </div>
  </div>

  <div class="canvas-container">
    <div>
      <p style="text-align:center;">Hidden Processed Image</p>
      <canvas id="originalCanvas"></canvas>
    </div>
    <div>
      <p style="text-align:center;">Kid Drawing</p>
      <canvas id="outlineCanvas"></canvas>
    </div>
  </div>

  <script>
    const upload = document.getElementById('upload');
    const thresholdInput = document.getElementById('threshold');
    const blurInput = document.getElementById('blurAmount');
    const thicknessInput = document.getElementById('thickness');
    
    const origCanvas = document.getElementById('originalCanvas');
    const outCanvas = document.getElementById('outlineCanvas');
    const origCtx = origCanvas.getContext('2d', { willReadFrequently: true });
    const outCtx = outCanvas.getContext('2d');

    let currentImage = null;

    // Listeners for all inputs
    [upload, thresholdInput, blurInput, thicknessInput].forEach(el => {
      el.addEventListener('change', processImage);
      el.addEventListener('input', () => { if (currentImage && el.type === 'range') processImage(); });
    });

    upload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const img = new Image();
      img.onload = () => {
        currentImage = img;
        origCanvas.width = outCanvas.width = img.width;
        origCanvas.height = outCanvas.height = img.height;
        processImage();
      };
      img.src = URL.createObjectURL(file);
    });

    function processImage() {
      if (!currentImage) return;

      const width = origCanvas.width;
      const height = origCanvas.height;
      const blurVal = blurInput.value;
      const threshold = parseInt(thresholdInput.value, 10);
      const thickness = parseInt(thicknessInput.value, 10);

      // 1. Draw original with a CSS blur to wipe out small details
      origCtx.filter = `blur(${blurVal}px)`;
      origCtx.drawImage(currentImage, 0, 0, width, height);

      // 2. Get blurred pixel data
      const srcData = origCtx.getImageData(0, 0, width, height);
      const pixels = srcData.data;

      // Fill output canvas with white paper background
      outCtx.fillStyle = 'white';
      outCtx.fillRect(0, 0, width, height);
      outCtx.fillStyle = '#222'; // Dark charcoal color for the drawing

      // Convert to Grayscale
      const gray = new Uint8ClampedArray(width * height);
      for (let i = 0; i < pixels.length; i += 4) {
        gray[i / 4] = 0.299 * pixels[i] + 0.587 * pixels[i + 1] + 0.114 * pixels[i + 2];
      }

      // 3. Apply Edge Detection and draw thick strokes
      // We step by 2 pixels to make it look a little more fragmented/sketchy
      for (let y = 1; y < height - 1; y += 2) {
        for (let x = 1; x < width - 1; x += 2) {
          const i = y * width + x;

          const gx =
            -gray[i - width - 1] + gray[i - width + 1] +
            -2 * gray[i - 1]     + 2 * gray[i + 1] +
            -gray[i + width - 1] + gray[i + width + 1];

          const gy =
            -gray[i - width - 1] - 2 * gray[i - width] - gray[i - width + 1] +
             gray[i + width - 1] + 2 * gray[i + width] + gray[i + width + 1];

          const magnitude = Math.sqrt(gx * gx + gy * gy);

          if (magnitude > threshold) {
            // Add a tiny bit of random jitter so lines aren't perfectly computer-straight
            const jitterX = (Math.random() - 0.5) * 2;
            const jitterY = (Math.random() - 0.5) * 2;
            
            outCtx.beginPath();
            outCtx.arc(x + jitterX, y + jitterY, thickness, 0, Math.PI * 2);
            outCtx.fill();
          }
        }
      }
    }
  </script>
</body>
</html>
